<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Wordpack：撕开一包英语词卡，按真实使用频次逐词加权抽取，正在学与已学过两个词库，标记已学过需要先拼写正确。">
<title>Wordpack · 拆一包英语词卡</title>
<style>/* Wordpack 壳层样式：纯白页面、右上双词库、抽屉与对话框。
 * 覆盖模板规则时统一加 body 前缀，确保优先级高于片段内的 <style>。
 */
:root { --wp-ink:#343a33; --wp-quiet:#767b70; --wp-line:#e2e4da; --wp-blue:#233feb; }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
html, body { margin:0; padding:0; background:#fff; color:var(--wp-ink); overflow-x:hidden; }
body { min-height:100svh; font-family:Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; -webkit-text-size-adjust:100%; }
body.wp-dialog-open { overflow:hidden; }
button { font:inherit; }
a { color:#2035b8; }
[hidden] { display:none !important; }

/* ---------- 顶栏 ---------- */
.wp-topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:1040px; margin:0 auto; padding:12px 14px 4px; }
.wp-brand { display:flex; align-items:baseline; gap:8px; min-width:0; }
.wp-brand b { font-size:19px; letter-spacing:-.6px; }
.wp-brand span { font-size:12px; color:var(--wp-quiet); letter-spacing:.4px; }
.wp-libs { display:flex; gap:8px; flex:0 0 auto; }
.wp-lib-button { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 13px; border:1px solid var(--wp-line); border-radius:999px; background:#fff; color:#41473c; font-size:14px; cursor:pointer; transition:background .18s,border-color .18s; }
.wp-lib-button:hover { background:#f5f7f1; border-color:#c6cabd; }
.wp-lib-button .wp-count { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; padding:1px 7px; border-radius:999px; background:#f0f1ea; }
.wp-lib-button.is-mastered .wp-count { background:#e6f5ea; color:#245f3d; }
.wp-main { max-width:1040px; margin:0 auto; padding:0 8px 8px; }
body #holo-pack-opening { max-width:1040px; margin:0 auto; }

/* ---------- 舞台内的模板覆盖：字号与按钮高度 ---------- */
body #holo-pack-opening .pack-controls { bottom:18px; gap:10px; }
body #holo-pack-opening .open-action { min-height:48px; padding:12px 26px; font-size:16px; letter-spacing:0; border-radius:10px; }
body #holo-pack-opening .status-line { font-size:14px; letter-spacing:0; min-height:20px; line-height:1.45; padding:0 16px; }
body #holo-pack-opening .rip-hint { font-size:14px; letter-spacing:.4px; }
body #holo-pack-opening .card-slot:focus-within { z-index:11; }

/* ---------- 底栏 ---------- */
.wp-footer { max-width:1040px; margin:6px auto 26px; padding:12px 14px 0; border-top:1px dashed var(--wp-line); display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:13px; color:var(--wp-quiet); }
.wp-footer .wp-tool { display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:0 13px; border:1px solid var(--wp-line); border-radius:999px; background:#fff; color:#454b40; font-size:13px; cursor:pointer; }
.wp-footer .wp-tool:hover { background:#f5f7f1; }
.wp-footer .wp-tool[aria-pressed="true"] .wp-sound-state { color:#1d6b3c; font-weight:700; }
.wp-footer svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.wp-footer .speaker { fill:currentColor; stroke:none; }
.wp-footer .wp-tool[aria-pressed="false"] .waves, .wp-footer .wp-tool[aria-pressed="true"] .muted { display:none; }
.wp-hint { line-height:1.5; }

/* ---------- 遮罩 / 抽屉 / 对话框 ---------- */
.wp-scrim { position:fixed; inset:0; z-index:60; background:rgba(18,20,16,.46); }
.wp-drawer, .wp-modal { position:fixed; z-index:70; background:#fff; color:var(--wp-ink); display:flex; flex-direction:column; max-height:92svh; box-shadow:0 24px 60px -18px rgba(20,24,18,.35); }
.wp-drawer { top:0; right:0; bottom:0; width:min(440px,100%); border-left:1px solid var(--wp-line); }
.wp-modal { top:50%; left:50%; transform:translate(-50%,-50%); width:min(600px,calc(100% - 20px)); border-radius:16px; border:1px solid var(--wp-line); }
.wp-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--wp-line); flex:0 0 auto; }
.wp-sheet-head h2 { margin:0; font-size:18px; letter-spacing:-.3px; }
.wp-sheet-close { width:44px; height:44px; border:1px solid var(--wp-line); border-radius:12px; background:#fff; font-size:20px; line-height:1; cursor:pointer; color:#4a4f45; }
.wp-sheet-body { overflow:auto; padding:14px 16px 20px; -webkit-overflow-scrolling:touch; flex:1 1 auto; }
.wp-tabs { display:flex; gap:8px; padding:12px 16px 0; flex:0 0 auto; }
.wp-tab { flex:1 1 0; min-height:44px; border:1px solid var(--wp-line); border-radius:11px; background:#fff; font-size:15px; cursor:pointer; color:#4a4f45; }
.wp-tab.is-on { background:var(--wp-blue); border-color:var(--wp-blue); color:#fff; font-weight:700; }
.wp-lib-summary { padding:10px 16px 0; font-size:13px; color:var(--wp-quiet); line-height:1.5; }
.wp-search { padding:10px 16px 0; }
.wp-search input { width:100%; min-height:46px; padding:10px 12px; font-size:16px; border:1px solid var(--wp-line); border-radius:11px; box-sizing:border-box; background:#fff; }
.wp-lib-list { list-style:none; margin:0; padding:6px 16px 16px; overflow:auto; flex:1 1 auto; }
.wp-lib-row { padding:12px 0; border-bottom:1px dashed var(--wp-line); }
.wp-lib-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.wp-lib-word { font-size:20px; font-weight:700; letter-spacing:-.3px; }
.wp-lib-badge, .wp-lib-rarity { font-size:12px; padding:2px 7px; border-radius:999px; background:#f1f2ec; color:#5a5f55; }
.wp-lib-meaning { margin:5px 0 9px; font-size:14px; line-height:1.5; color:#4c524a; }
.wp-lib-actions, .wp-detail-actions { display:flex; flex-wrap:wrap; gap:8px; }
.wp-lib-empty { padding:24px 4px; font-size:14px; color:var(--wp-quiet); line-height:1.6; }
.wp-lib-more { padding:12px 0 0; }
.wp-btn { min-height:44px; padding:0 15px; border:1px solid var(--wp-line); border-radius:11px; background:#fff; color:#3f453b; font-size:15px; cursor:pointer; }
.wp-btn:hover { background:#f5f7f1; }
.wp-btn[disabled] { opacity:.55; cursor:default; }
.wp-btn-primary { background:var(--wp-blue); border-color:var(--wp-blue); color:#fff; font-weight:700; }
.wp-btn-primary:hover { background:#1b32c8; }

/* ---------- 拼写校验 ---------- */
.wp-spell-lead { margin:0 0 10px; font-size:13px; color:var(--wp-quiet); line-height:1.6; }
.wp-spell-meta { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
.wp-chip { font-size:13px; padding:5px 10px; border-radius:999px; background:#f2f3ed; color:#4d5349; }
.wp-spell-meaning { padding:12px 14px; border:1px solid var(--wp-line); border-radius:12px; background:#fbfbf7; max-height:34svh; overflow:auto; }
.wp-meaning-line { font-size:15px; line-height:1.6; }
.wp-spell-hint { margin:12px 0 0; font-size:14px; color:#4c524a; }
.wp-spell-error { margin:12px 0 0; font-size:14px; line-height:1.5; color:#a3283f; background:#fdeef1; border:1px solid #f0c8d1; border-radius:10px; padding:9px 11px; }
.wp-spell-input { width:100%; margin:12px 0 4px; padding:12px 14px; font-size:20px; letter-spacing:1.5px; border:1px solid #c8ccc0; border-radius:12px; box-sizing:border-box; background:#fff; color:var(--wp-ink); }
.wp-spell-input.is-shaking { animation:wp-shake .32s ease-in-out; border-color:#d0566f; }
@keyframes wp-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-3px)} }
.wp-dialog-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.wp-dialog-actions .wp-btn { flex:1 1 auto; }

/* ---------- 详情 / 数据说明 ---------- */
.wp-detail-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
.wp-detail-word { font-size:28px; font-weight:800; letter-spacing:-.6px; }
.wp-detail-phonetic { font-size:15px; color:#5c6157; }
.wp-detail-rarity { font-size:13px; padding:3px 9px; border-radius:999px; background:#f1f2ec; color:#5a5f55; }
.wp-detail-h { margin:18px 0 6px; font-size:14px; letter-spacing:.2px; color:var(--wp-quiet); }
.wp-detail-p { margin:0 0 8px; font-size:15px; line-height:1.65; }
.wp-facts { margin:0; display:grid; grid-template-columns:minmax(96px,max-content) 1fr; gap:6px 12px; font-size:14px; line-height:1.55; }
.wp-facts dt { color:var(--wp-quiet); }
.wp-facts dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.wp-detail-note { margin:14px 0 0; padding:11px 13px; border-left:3px solid var(--wp-blue); background:#f7f8f3; font-size:13px; line-height:1.7; color:#4a5049; }
.wp-detail-actions { margin-top:18px; }

/* ---------- 提示条 ---------- */
.wp-banner { max-width:1016px; margin:8px auto 0; padding:10px 13px; border:1px solid #eed9a8; background:#fff8e6; color:#7a5311; border-radius:12px; font-size:13px; line-height:1.55; }
.wp-toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:90; max-width:min(520px,calc(100% - 24px)); padding:11px 15px; border-radius:12px; background:#31362e; color:#fff; font-size:14px; line-height:1.5; box-shadow:0 16px 40px -14px rgba(20,24,18,.5); }

@media (max-width:620px) {
  .wp-topbar { padding:10px 12px 2px; }
  .wp-brand span { display:none; }
  .wp-lib-button { font-size:13px; padding:0 11px; gap:6px; }
  .wp-drawer { top:auto; left:0; right:0; bottom:0; width:auto; height:90svh; border:1px solid var(--wp-line); border-radius:18px 18px 0 0; border-bottom:0; }
  .wp-modal { width:calc(100% - 16px); }
  .wp-facts { grid-template-columns:1fr; gap:2px 0; }
  .wp-facts dd { margin-bottom:8px; }
  .wp-footer { padding-bottom:4px; }
}
@media (prefers-reduced-motion:reduce) {
  .wp-spell-input.is-shaking { animation:none; }
  * { scroll-behavior:auto !important; }
}
</style>
</head>
<body>
<header class="wp-topbar" id="wp-topbar">
  <div class="wp-brand"><b>Wordpack</b><span>拆一包，记住几个词</span></div>
  <div class="wp-libs">
    <button type="button" class="wp-lib-button" id="lib-learning"><span>正在学</span><span class="wp-count">0</span></button>
    <button type="button" class="wp-lib-button is-mastered" id="lib-mastered"><span>已学过</span><span class="wp-count">0</span></button>
  </div>
</header>
<p class="wp-banner" id="storage-banner" role="status" hidden></p>
<main class="wp-main" id="wp-main">
<div id="holo-pack-opening" data-state="sealed">
  <style>
    #holo-pack-opening{--foil:#233feb;--foil-deep:color-mix(in srgb,var(--foil) 52%,#05061f);--glow:#ffffff;--ink:#343a33;--quiet:#777b70;--tear-y:24px;width:100%;max-width:1040px;position:relative;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);isolation:isolate;text-align:left}
    #holo-pack-opening *{box-sizing:border-box}
    #holo-pack-opening [hidden]{display:none!important}
    #holo-pack-opening button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    #holo-pack-opening button:focus-visible{outline:2px solid #5761b5;outline-offset:6px}
    #holo-pack-opening .holo-stage{position:relative;width:100%;-webkit-user-select:none;user-select:none;height:max(660px,calc(var(--rows,1)*320px + 230px));overflow:hidden;background:#fff}
    /* sealed 只放一个卡包：按视口高度居中（只缩小不增高，桌面沿用原来的 680px），opening/revealed 才用全部卡片所需高度。 */
    #holo-pack-opening[data-state="sealed"] .holo-stage{height:clamp(540px,calc(100svh - 210px),680px)}
    #holo-pack-opening .stage-grain{position:absolute;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%236b6c55' filter='url(%23n)' opacity='.22' d='M0 0h160v160H0z'/%3E%3C/svg%3E")}
    #holo-pack-opening .ambient{position:absolute;inset:-15%;pointer-events:none;background:conic-gradient(from 34deg at 32% 40%,transparent 0deg,rgba(255,255,255,.21) 1deg,transparent 20deg 100deg,rgba(255,255,255,.2) 102deg,transparent 125deg);opacity:.6}
    #holo-pack-opening .holo-header{position:absolute;top:25px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:9}
    #holo-pack-opening .wordmark{font-size:25px;font-weight:700;letter-spacing:-1.3px;line-height:1}
    #holo-pack-opening .brand-sub{font-size:10px;letter-spacing:1.5px;margin-top:8px;color:var(--quiet)}
    #holo-pack-opening .header-tools{display:flex;align-items:center;gap:8px}
    #holo-pack-opening .tool-button{height:29px;min-width:29px;padding:0 10px;border:1px solid #d9dbcf;border-radius:999px;background:#fffef6cc;color:#5d6257;font-size:11px;letter-spacing:.3px;display:inline-grid;place-items:center;transition:background .2s,border-color .2s}
    #holo-pack-opening .tool-button:hover{background:#fff;border-color:#c5c8bb}
    #holo-pack-opening .sound-toggle{padding:0}
    #holo-pack-opening .sound-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    #holo-pack-opening .sound-toggle .speaker{fill:currentColor;stroke:none}
    #holo-pack-opening .sound-toggle[aria-pressed="false"] .waves,#holo-pack-opening .sound-toggle[aria-pressed="true"] .muted{display:none}
    #holo-pack-opening .rates-toggle[aria-expanded="true"]{background:#fff;border-color:#a8aa9e}
    #holo-pack-opening .pack-picker{display:flex;align-items:center;gap:2px}
    #holo-pack-opening .color-choice{width:29px;height:29px;border:1px solid transparent;border-radius:50%;padding:7px;background:transparent;display:grid;place-items:center}
    #holo-pack-opening .color-choice:before{content:"";display:block;width:13px;height:13px;border-radius:50%;background:var(--swatch);box-shadow:inset 0 1px 2px #ffffff70}
    #holo-pack-opening .color-choice[aria-pressed="true"]{border-color:#a8aa9e}
    #holo-pack-opening .color-choice:disabled{opacity:.5;cursor:default}
    #holo-pack-opening .rates-panel{position:absolute;top:64px;right:24px;z-index:10;width:min(260px,calc(100% - 48px));padding:14px 16px 12px;border:1px solid #dcdfd3;border-radius:8px;background:#fffef8f7;box-shadow:0 14px 34px -14px #3a3d3050;font-size:12px;line-height:1.5;color:#454b40}
    #holo-pack-opening .rates-title{font-weight:700;margin-bottom:6px;letter-spacing:.3px}
    #holo-pack-opening .rate-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed #e1e3d8}
    #holo-pack-opening .rate-row strong{font-variant-numeric:tabular-nums}
    #holo-pack-opening .rate-epic strong{color:#7b3fc4}
    #holo-pack-opening .rate-legendary strong{color:#b77800}
    #holo-pack-opening .rate-note{margin:7px 0 0;color:var(--quiet);font-size:11px}
    #holo-pack-opening .floor-shadow{position:absolute;left:50%;top:76%;width:150px;height:16px;background:#797a6650;filter:blur(12px);border-radius:50%;transform:translateX(-50%);transition:opacity .5s}
    #holo-pack-opening[data-state="opening"] .floor-shadow,#holo-pack-opening[data-state="revealed"] .floor-shadow{opacity:0}
    #holo-pack-opening .pack-zone{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:164px;height:238px;perspective:850px;z-index:4;touch-action:none}
    #holo-pack-opening .pack-zone:before{content:"";position:absolute;inset:-18px -14px}
    #holo-pack-opening[data-state="sealed"] .pack-zone{cursor:grab}
    #holo-pack-opening .pack-glow{position:absolute;inset:-22% -48%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--foil) 40%,#fff) 0%,color-mix(in srgb,var(--foil) 30%,transparent) 42%,transparent 72%);opacity:0;transform:scale(.82);filter:blur(8px);transition:opacity .35s,transform .45s cubic-bezier(.2,.7,.2,1)}
    #holo-pack-opening .pack-float{pointer-events:none}
    #holo-pack-opening .pack-body:focus-visible{outline:none}
    #holo-pack-opening .pack-float{width:100%;height:100%;position:relative;animation:holo-idle 4.4s ease-in-out infinite;transform-style:preserve-3d}
    #holo-pack-opening .pack-shake,#holo-pack-opening .pack-tilt{width:100%;height:100%;position:relative;transform-style:preserve-3d}
    #holo-pack-opening .pack-tilt{transform:translateY(var(--lift,0px)) scale(var(--pop,1)) rotateX(var(--prx,0deg)) rotateY(var(--pry,0deg));transition:transform .22s cubic-bezier(.2,.7,.2,1)}
    #holo-pack-opening .pack-body{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;appearance:none;border:0;border-radius:3px;background:transparent;filter:drop-shadow(1px 10px 9px #45453528);touch-action:none;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;transition:filter .3s}
        #holo-pack-opening .pack-art{position:absolute;inset:0}
    #holo-pack-opening .pack-flap{position:absolute;inset:0;pointer-events:none;z-index:6;filter:drop-shadow(0 5px 3px #0d123a3d);will-change:transform}
    #holo-pack-opening .foil-main{position:absolute;inset:10px 3px 9px;background:linear-gradient(98deg,#fff5 0%,transparent 8% 25%,#ffffff12 30%,transparent 40% 75%,#0002 92%,#fff3 97%),linear-gradient(170deg,var(--foil),var(--foil) 38%,var(--foil-deep) 100%);box-shadow:inset 2px 0 2px #ffffff68,inset -3px 0 3px #0004,inset 0 2px 2px #fff4;overflow:hidden;clip-path:polygon(0 0,100% 0,98% 19%,100% 40%,98.5% 61%,100% 100%,0 100%,1.5% 74%,0 48%,1% 23%)}
    #holo-pack-opening .foil-main:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 32%,#ffffff16 38%,transparent 41% 54%,#7eefff1a 60%,transparent 65%);mix-blend-mode:screen}
    #holo-pack-opening .pack-shine{position:absolute;inset:-10% -70%;pointer-events:none;background:linear-gradient(105deg,transparent 42%,#ffffff40 47%,#d9fffb88 50%,#ffe3fb55 53%,transparent 58%);transform:translateX(-75%);mix-blend-mode:screen;z-index:2}
    #holo-pack-opening .pack-crease{position:absolute;left:6px;right:6px;bottom:13px;height:8px;border-bottom:1px solid #fff4;border-top:1px solid #0002;opacity:.5}
    #holo-pack-opening .pack-title{position:absolute;left:14px;top:21px;font-weight:700;font-size:21px;letter-spacing:-1.2px;color:#fff;z-index:1}
    #holo-pack-opening .pack-emblem{position:absolute;width:126px;height:136px;left:17px;top:50px;filter:drop-shadow(1px 6px 3px #020a6d55)}
    #holo-pack-opening .pack-caption{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#ffffffc4;font-size:8px;letter-spacing:2px}
    #holo-pack-opening .pack-series{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#ffffff7d;font-size:5.5px;letter-spacing:1px}
    #holo-pack-opening .pack-seal{position:absolute;left:0;right:0;height:15px;background:repeating-linear-gradient(90deg,#ffffff12 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--foil),var(--foil-deep));box-shadow:inset 0 3px 2px #ffffff42,inset 0 -2px 2px #0002;clip-path:polygon(0 9%,4% 1%,8% 8%,12% 0,16% 8%,20% 0,24% 8%,28% 0,32% 8%,36% 0,40% 8%,44% 0,48% 8%,52% 0,56% 8%,60% 0,64% 8%,68% 0,72% 8%,76% 0,80% 8%,84% 0,88% 8%,92% 0,96% 8%,100% 0,100% 94%,0 100%)}
    #holo-pack-opening .seal-top{top:0}
    #holo-pack-opening .seal-bottom{bottom:0;transform:rotate(180deg)}
    #holo-pack-opening .tear-guide{position:absolute;left:5px;right:5px;top:var(--tear-y);height:0;border-top:1.5px dashed #ffffffb8;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
    #holo-pack-opening .tear-guide:after{content:"";position:absolute;left:0;top:-4px;width:24px;height:7px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(.6px)}

<script>/* Wordpack · 学习状态与逐词频次抽样（纯逻辑，无 DOM；可在 Node 中 require 测试）
 * 权重语义：P(word_i @ 第 k 次) = frequency_i / Σ frequency_j（j ∈ 未掌握且本包未抽中）
 * 无档位抽样、无保底、无 pity；已掌握词不进池；同一包内不重复；跨包可重复。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.WordpackLogic = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const STORAGE_KEY = 'wordpack.learning.v1';
  const SCHEMA = 1;
  const PACK_SIZE = 5;
  /* 每 60 秒最多成功开一包：绝对期限单独成键，不动两库 schema，也不影响任何学习进度。 */
  const COOLDOWN_KEY = 'wordpack.cooldown.v1';
  const COOLDOWN_SCHEMA = 1;
  const PACK_COOLDOWN_MS = 60000;
  const COOLDOWN_LOCK = 'wordpack.pack-open';
  const ORDER = ['common', 'rare', 'epic', 'legendary'];
  const RARITY_ZH = { common: '常见', rare: '稀有', epic: '史诗', legendary: '传说' };
  const MAX_PACK_KEYS = 400;
  const MASKED_MARK = '【已隐藏】';

  /* ---------- 小工具 ---------- */
  const isId = id => typeof id === 'string' && id.length > 0 && id.length <= 128;
  const isFiniteNumber = v => typeof v === 'number' && Number.isFinite(v);
  const now = () => Date.now();

  function rankOf(rarity) {
    const i = ORDER.indexOf(rarity);
    return i < 0 ? 0 : i;
  }

  /** 密码学均匀随机数 [0,1)；不可用时退回 Math.random。 */
  function cryptoRng() {
    const c = typeof crypto !== 'undefined' ? crypto : null;
    if (c && typeof c.getRandomValues === 'function') {
      return () => c.getRandomValues(new Uint32Array(1))[0] / 4294967296;
    }
    return Math.random;
  }

  /* ---------- 存储 ---------- */
  function createStorage(backing, key) {
    const storageKey = typeof key === 'string' && key.length ? key : STORAGE_KEY;
    let store = backing && typeof backing.getItem === 'function' && typeof backing.setItem === 'function' ? backing : null;
    let available = false;
    if (store) {
      try {
        const probe = `${storageKey}:__probe__`;
        store.setItem(probe, '1');
        store.removeItem(probe);
        available = true;
      } catch (e) { available = false; }
    }
    return {
      available,
      read() {
        if (!available) return null;
        try { return store.getItem(storageKey); } catch (e) { return null; }
      },
      write(text) {
        if (!available) return false;
        try { store.setItem(storageKey, text); return true; } catch (e) { return false; }
      },
      clear() { if (!available) return false; try { store.removeItem(storageKey); return true; } catch (e) { return false; } }
    };
  }

  function storageFromGlobal() {
    try { return typeof localStorage !== 'undefined' ? localStorage : null; } catch (e) { return null; }
  }

  function locksFromGlobal() {
    try { return typeof navigator !== 'undefined' && navigator.locks ? navigator.locks : null; } catch (e) { return null; }
  }

  function emptyState() {
    return { schema: SCHEMA, updatedAt: 0, entries: {}, packs: [], sessionOnly: false };
  }

  function sanitizeEntry(raw, id) {
    if (!raw || typeof raw !== 'object') return null;
    const state = raw.state === 'mastered' ? 'mastered' : raw.state === 'learning' ? 'learning' : null;
    if (!state) return null;
    const count = isFiniteNumber(raw.count) && raw.count >= 1 ? Math.min(1e9, Math.floor(raw.count)) : 1;
    const addedAt = isFiniteNumber(raw.addedAt) && raw.addedAt >= 0 ? Math.floor(raw.addedAt) : 0;
    const masteredAt = state === 'mastered' && isFiniteNumber(raw.masteredAt) && raw.masteredAt >= 0 ? Math.floor(raw.masteredAt) : 0;
    return { id, state, count, addedAt, masteredAt };
  }

  /** 解析任意来源字符串；不可信字段一律丢弃，返回 null 表示需要重建。 */
  function parseStored(text) {
    if (typeof text !== 'string' || !text.length) return null;
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    if (!data || typeof data !== 'object' || data.schema !== SCHEMA || !data.entries || typeof data.entries !== 'object') return null;
    const entries = {};
    Object.keys(data.entries).forEach(id => {
      if (!isId(id)) return;
      const entry = sanitizeEntry(data.entries[id], id);
      if (entry) entries[id] = entry;
    });
    const packs = Array.isArray(data.packs) ? data.packs.filter(isId).slice(-MAX_PACK_KEYS) : [];
    return {
      schema: SCHEMA,
      updatedAt: isFiniteNumber(data.updatedAt) ? Math.floor(data.updatedAt) : 0,
      entries,
      packs,
      sessionOnly: false
    };
  }

  /* ---------- 词库索引 ---------- */
  function createIndex(pool) {
    const words = Array.isArray(pool) ? pool : [];
    const byId = new Map();
    const byWord = new Map();
    words.forEach(w => {
      if (!w || !isId(w.id) || typeof w.word !== 'string') return;
      if (!byId.has(w.id)) byId.set(w.id, w);
      const key = w.word.toLowerCase();
      if (!byWord.has(key)) byWord.set(key, w);
    });
    return {
      size: byId.size,
      list: words,
      get: id => byId.get(id) || null,
      byWord: key => byWord.get(String(key == null ? '' : key).toLowerCase()) || null,
      totalWeight: words.reduce((sum, w) => sum + (isFiniteNumber(w.frequency) && w.frequency > 0 ? w.frequency : 0), 0)
    };
  }

  /* ---------- 抽样 ---------- */
  function positiveWeight(word) {
    return word && isFiniteNumber(word.frequency) && word.frequency > 0;
  }

  /** 累积权重表 + 二分查找：u ∈ [0,total) 映射到下标。 */
  function buildCumulative(words) {
    const cumulative = new Float64Array(words.length);
    let sum = 0;
    for (let i = 0; i < words.length; i++) { sum += words[i].frequency; cumulative[i] = sum; }
    return { cumulative, total: sum };
  }

  function searchCumulative(cumulative, total, u) {
    const target = Math.min(Math.max(u, 0), total * (1 - 2 ** -53));
    let lo = 0, hi = cumulative.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cumulative[mid] > target) hi = mid; else lo = mid + 1; }
    return lo;
  }

  function excludeMastered(words, entries) {
    const table = entries || {};
    return words.filter(w => {
      const entry = table[w.id];
      return !(entry && entry.state === 'mastered');
    });
  }

  /**
   * 逐词频次加权、无放回抽取。
   * 每抽中一个就把权重从总和中剔除并重建累积表，因此
   * P(word_i at pick k) = frequency_i / Σ(未被本包抽中且未掌握词的 frequency)。
   */
  function samplePack(words, count, rng) {
    const candidates = (Array.isArray(words) ? words : []).filter(positiveWeight);
    const size = Math.max(0, Math.min(Math.floor(isFiniteNumber(count) ? count : 0), candidates.length));
    const random = typeof rng === 'function' ? rng : cryptoRng();
    const taken = new Uint8Array(candidates.length);
    const picked = [];
    for (let k = 0; k < size; k++) {
      const alive = [];
      for (let i = 0; i < candidates.length; i++) if (!taken[i]) alive.push(i);
      const aliveWords = alive.map(i => candidates[i]);
      const { cumulative, total } = buildCumulative(aliveWords);
      if (!(total > 0)) break;
      const at = searchCumulative(cumulative, total, random() * total);
      taken[alive[at]] = 1;
      picked.push(candidates[alive[at]]);
    }
    return picked;
  }

  /** 只做展示排序：稀有度升序、同档保持抽取顺序，好卡压轴。 */
  function sortByRarityStable(cards) {
    return cards.map((card, i) => [card, i]).sort((a, b) => rankOf(a[0].rarity) - rankOf(b[0].rarity) || a[1] - b[1]).map(pair => pair[0]);

  function normalizeSpelling(input) {

  }

  /** 忽略首尾空格与大小写，其余必须逐字母精确一致。 */
  function checkSpelling(input, answer) {

    const given = normalizeSpelling(input);
    return { ok: expected.length > 0 && given.length > 0 && given === expected, expected, given };
  }

  function maskTargetWord(text, target) {
    const source = String(text == null ? '' : text);
    const word = String(target == null ? '' : target).trim();
    if (!source || !word) return source;
    const pattern = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { return source.replace(new RegExp(`\\b${pattern}\\b`, 'gi'), MASKED_MARK); }
    catch (e) { return source; }
  }

  /* ---------- 开包冷却（60 秒一包，绝对期限 + 同源标签页共享） ---------- */
  /** 损坏/异常时间一律按“已过期”处理，绝不因为脏数据永久锁住；未来的值最多锁一个完整周期。 */
  function sanitizeCooldownValue(raw, nowValue, intervalMs) {
    const period = positiveInterval(intervalMs);
    if (!isFiniteNumber(raw) || !isFiniteNumber(nowValue)) return 0;
    const at = Math.floor(raw);
    if (at <= 0) return 0;
    if (at <= Math.floor(nowValue)) return at;
    return at - Math.floor(nowValue) > period ? 0 : at;
  }

  function positiveInterval(value) {
    return isFiniteNumber(value) && value > 0 ? Math.floor(value) : PACK_COOLDOWN_MS;
  }

  /** 距下一次可开包还需等待的毫秒数；0 表示现在就能撕。 */
  function cooldownWait(nowValue, nextAtValue, intervalMs) {
    const period = positiveInterval(intervalMs);
    const at = sanitizeCooldownValue(nextAtValue, nowValue, period);
    return at > 0 ? Math.max(0, at - Math.floor(nowValue)) : 0;
  }

  /**
   * 检查并占用一次开包机会：只在成功时把期限推到现在 + 一个周期，
   * 失败（含并发等待）不写、也不延长既有期限，因此半撕/震动/空池永不消耗次数。
   * verify 为可选校验回调（锁内执行）：返回假值表示这次其实不该占用，期限保持原样。
   */
  function claimCooldown(nowValue, nextAtValue, intervalMs, verify) {
    const period = positiveInterval(intervalMs);
    const wait = cooldownWait(nowValue, nextAtValue, period);
    if (wait > 0) return { ok: false, reason: 'cooldown', waitMs: wait, nextAt: Math.floor(nowValue) + wait };
    if (!isFiniteNumber(nowValue)) return { ok: false, reason: 'bad-clock', waitMs: period, nextAt: 0 };
    if (typeof verify === 'function' && !verify()) return { ok: false, reason: 'invalid', waitMs: 0, nextAt: Math.floor(nextAtValue) || 0 };
    return { ok: true, reason: null, waitMs: 0, nextAt: Math.floor(nowValue) + period };
  }

  function parseCooldownStored(text) {
    if (typeof text !== 'string' || !text.length) return 0;
    let data;
    try { data = JSON.parse(text); } catch (e) { return 0; }
    if (!data || typeof data !== 'object' || data.schema !== COOLDOWN_SCHEMA) return 0;
    return isFiniteNumber(data.nextAt) ? Math.floor(data.nextAt) : 0;
  }

  /** mm:ss 倒计时文本（超过一小时仍按累计分钟显示）。 */
  function formatCountdown(ms) {
    const total = isFiniteNumber(ms) && ms > 0 ? Math.ceil(ms / 1000) : 0;
    const minutes = Math.floor(total / 60), seconds = total % 60;
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  /**
   * 冷却存储门面：backend 缺失时只做会话内计时（sessionOnly），与学习库两库 schema 完全独立。
   * 每次检查都重新读取共享存储，所以刷新、重开、同源其他标签页都已生效。
   */
  function createCooldownStore(options) {
    const opts = options || {};
    const interval = positiveInterval(opts.interval);
    const clock = typeof opts.now === 'function' ? opts.now : now;
    const backend = opts.storage || createStorage(opts.backing === undefined ? storageFromGlobal() : opts.backing, COOLDOWN_KEY);
    const locks = opts.locks === undefined ? locksFromGlobal() : opts.locks;
    let memoryNextAt = 0, pending = false, claimSeq = 0, degraded = !backend.available;

    function readNextAt() {
      const at = backend.available ? sanitizeCooldownValue(parseCooldownStored(backend.read()), clock(), interval) : 0;
      return Math.max(at, sanitizeCooldownValue(memoryNextAt, clock(), interval));
    }
    function writeNextAt(at) {
      memoryNextAt = at;
      if (!backend.available) { degraded = true; return false; }
      const ok = backend.write(JSON.stringify({ schema: COOLDOWN_SCHEMA, nextAt: at }));
      if (!ok) degraded = true;
      return ok;
    }
    function claimNow(verify) {
      const stamp = clock();
      const result = claimCooldown(stamp, readNextAt(), interval, verify);
      if (result.ok) writeNextAt(result.nextAt);
      return result;
    }
    const api = {
      interval,
      get sessionOnly() { return degraded; },
      nextAt() { return readNextAt(); },
      waitMs() { return cooldownWait(clock(), readNextAt(), interval); },
      canOpen() { return api.waitMs() <= 0; },
      /**
       * 唯一消耗次数的入口：同源标签页通过 navigator.locks 串行，后备路径也重新检查本地时间戳。
       * verify 在锁内、写期限之前执行（例如确认本包结果仍非空），绝不因为校验失败而占用次数。
       */
      claim(verify) {
        if (pending) return Promise.resolve({ ok: false, reason: 'busy', waitMs: api.waitMs(), nextAt: readNextAt() });
        /* 本次尝试的序号：只有它自己的收尾逻辑能动 pending，迟到的旧链不得误放行新的一次。 */
        const attempt = ++claimSeq;
        const finish = result => { if (attempt === claimSeq) pending = false; return result; };
        if (locks && typeof locks.request === 'function') {
          pending = true;
          let lock;
          try { lock = locks.request(COOLDOWN_LOCK, () => claimNow(verify)); }
          catch (e) {
            /* 同步抛错时浏览器不会运行释放回调，这一次尝试就地收尾；返回可恢复提示，绝不留未处理 rejection。 */
            const message = e && e.message ? String(e.message) : '';
            return Promise.resolve(finish({ ok: false, reason: 'lock-failed', waitMs: api.waitMs(), nextAt: readNextAt(), detail: message.slice(0, 80) }));
          }
          return Promise.resolve(lock)
            .catch(error => ({ ok: false, reason: 'lock-failed', waitMs: api.waitMs(), nextAt: readNextAt(), detail: error && error.message ? String(error.message).slice(0, 80) : '' }))
            .then(finish);
        }
        try { return Promise.resolve(claimNow(verify)); }
        catch (e) { return Promise.resolve({ ok: false, reason: 'storage-failed', waitMs: api.waitMs(), nextAt: readNextAt() }); }
      },
      /** 供测试与异常恢复：只读取，不写。 */
      peek() { return { nextAt: readNextAt(), waitMs: cooldownWait(clock(), readNextAt(), interval), interval }; }
    };
    return api;
  }

  /* ---------- 状态迁移 ---------- */
  function touch(state, when) { state.updatedAt = when; return state; }

  function trimPacks(state) {
    if (state.packs.length > MAX_PACK_KEYS) state.packs = state.packs.slice(-MAX_PACK_KEYS);
    return state;
  }

  /**
   * 整包入库。packId 幂等：重复提交不产生第二份词条，也不重复累加次数。
   * 新词默认 learning；已 mastered 的词保持 mastered（不降级），仅累计次数。
   */
  function applyRevealed(state, packId, cards, when) {
    const stamp = isFiniteNumber(when) ? Math.floor(when) : now();
    if (!isId(packId) || !Array.isArray(cards) || !cards.length) return { state, added: 0, changed: false, skipped: 'invalid' };
    if (state.packs.indexOf(packId) >= 0) return { state, added: 0, changed: false, skipped: 'duplicate-pack' };
    let added = 0;
    cards.forEach(card => {
      const id = card && card.id;
      if (!isId(id)) return;
      const existing = state.entries[id];
      if (existing) {
        existing.count += 1;
        if (existing.state !== 'mastered') existing.state = 'learning';
      } else {
        state.entries[id] = { id, state: 'learning', count: 1, addedAt: stamp, masteredAt: 0 };
        added += 1;
      }
    });
    state.packs.push(packId);
    trimPacks(state);
    touch(state, stamp);
    return { state, added, changed: true, skipped: null };
  }

  /** 只有拼写通过后由调用方触发：learning → mastered，原子单条目迁移。 */
  function promote(state, id, when) {
    const stamp = isFiniteNumber(when) ? Math.floor(when) : now();
    const entry = state.entries[id];
    if (!entry) return { state, changed: false, reason: 'unknown-word' };
    if (entry.state === 'mastered') return { state, changed: false, reason: 'already-mastered' };
    entry.state = 'mastered';
    entry.masteredAt = stamp;
    touch(state, stamp);
    return { state, changed: true, reason: null };
  }

  /** 已学过 → 正在学；不记录“曾通过拼写”，之后仍需重新拼写。 */
  function demote(state, id, when) {
    const stamp = isFiniteNumber(when) ? Math.floor(when) : now();
    const entry = state.entries[id];
    if (!entry) return { state, changed: false, reason: 'unknown-word' };
    if (entry.state !== 'mastered') return { state, changed: false, reason: 'not-mastered' };
    entry.state = 'learning';
    entry.masteredAt = 0;
    touch(state, stamp);
    return { state, changed: true, reason: null };
  }

  function counts(state) {
    let learning = 0, mastered = 0;
    Object.keys(state.entries).forEach(id => { if (state.entries[id].state === 'mastered') mastered += 1; else learning += 1; });
    return { learning, mastered, seen: learning + mastered };
  }

  /* ---------- 概率显示 ---------- */
  /** 全词库归一化概率（words.json 的 probability 字段口径），不显示假的 0%。 */
  function formatProbability(p) {
    if (!isFiniteNumber(p) || p <= 0) return '0';
    const percent = p * 100;
    if (percent >= 1) return `${percent.toFixed(2)}%`;
    if (percent >= 1e-3) return `${percent.toFixed(4)}%`;
    const exp = percent.toExponential(3);
    return `${exp}%`;
  }

  function formatFrequency(n) {
    if (!isFiniteNumber(n)) return '';
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /** 存储门面：负责读写、可用性标记与事件广播。 */
  function createStore(options) {
    const opts = options || {};
    const backend = opts.storage || createStorage(opts.backing === undefined ? storageFromGlobal() : opts.backing);
    const index = opts.index || createIndex([]);
    const parsed = backend.available ? parseStored(backend.read()) : null;
    const state = parsed || emptyState();
    state.sessionOnly = !backend.available;
    /* 记住“上次看到的同一份存档”，同步时才能分辨另一页的独有内容，避免互相覆盖。 */
    let lastSynced = parsed;
    const stampTime = typeof opts.now === 'function' ? opts.now : now;
    // 词库换版后，历史里不存在的 id 不再参与展示与抽样。
    Object.keys(state.entries).forEach(id => { if (!index.get(id)) delete state.entries[id]; });

    const listeners = [];
    function markSessionOnly() {
      state.sessionOnly = true;
      api.sessionOnly = true;
      return false;
    }
    /** 只在“确实与存档不同”时替换内存，保留本页尚未写出的改动。 */
    function adopt(fresh) {
      state.schema = fresh.schema;
      state.updatedAt = fresh.updatedAt;
      state.entries = fresh.entries;
      state.packs = fresh.packs;
      state.sessionOnly = !backend.available;
      return state;
    }
    /**
     * 读取当前共享存储并校验（不重载页面、不清进度）。
     * 返回 null 表示存储不可用或存档损坏/含未知 id，调用方必须保持现有内存状态；
     * changed=true 表示本页内存已被另一标签页的存档更新。
     * 基准是“本页最后一次落盘的那份存档”而不是内存里的时间戳：另一页在同一毫秒内写入也能被发现；
     * 存档严格更晚才整体生效；同刻并列取并集，谁都不覆盖谁的词；
     * 存档不比基准新时一律保留本页内存，绝不把本页刚写入的 promote/demote 倒退回旧状态。
     */
    function sync() {
      if (!backend.available) { api.sessionOnly = true; state.sessionOnly = true; return null; }
      const fresh = parseStored(backend.read());
      if (!fresh) return null;
      /* 存档里带 id 的词条就是全部事实；其余键（如手工塞入的历史 id）视为脏数据，整份拒绝。 */
      if (!Object.keys(fresh.entries).every(id => Boolean(index.get(id)))) return null;
      const base = lastSynced ? lastSynced.updatedAt || 0 : state.updatedAt || 0;
      const at = fresh.updatedAt || 0;
      let next = null;
      if (at > base) next = fresh;
      else if (at === base && JSON.stringify({ e: fresh.entries, p: fresh.packs }) !== JSON.stringify({ e: state.entries, p: state.packs })) {
        /* 同一毫秒两页各写各的：按 addedAt/masteredAt 逐词取较新，再并入本页已知条目。 */
        const stampOf = entry => Math.max(entry.addedAt || 0, entry.masteredAt || 0);
        const merged = { ...state.entries };
        Object.keys(fresh.entries).forEach(id => {
          const incoming = fresh.entries[id], existing = merged[id];
          if (!existing || stampOf(incoming) > stampOf(existing)) merged[id] = incoming;
        });
        next = { schema: SCHEMA, updatedAt: at, entries: merged, packs: [...new Set([...state.packs, ...fresh.packs])].slice(-MAX_PACK_KEYS) };
      }
      if (!next) return { changed: false, updatedAt: state.updatedAt, entries: Object.keys(state.entries).length };
      const changed = JSON.stringify({ e: next.entries, p: next.packs }) !== JSON.stringify({ e: state.entries, p: state.packs });
      if (changed) adopt(next);
      lastSynced = fresh;
      api.sessionOnly = state.sessionOnly;
      return { changed, updatedAt: state.updatedAt, entries: Object.keys(state.entries).length };
    }
    const api = {
      state,
      index,
      storage: backend,
      sessionOnly: state.sessionOnly,
      sync,
      persist() {
        if (!backend.available) return markSessionOnly();
        const ok = backend.write(JSON.stringify({ schema: SCHEMA, updatedAt: state.updatedAt, entries: state.entries, packs: state.packs }));
        // 记住本页最后一次落盘的存档：另一页在同一毫秒内写入也能被 sync 分辨出来。
        if (ok) lastSynced = parseStored(backend.read());
        // 初始探测成功、后续因配额等原因写入失败：同样必须降级为“仅本次会话”。
        return ok ? true : markSessionOnly();
      },
      subscribe(fn) { listeners.push(fn); return () => { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); }; },
      emit(reason) { listeners.forEach(fn => { try { fn(reason); } catch (e) {} }); },
      entryOf(id) { return state.entries[id] || null; },
      stateOf(id) { const e = state.entries[id]; return e ? e.state : null; },
      counts() { return counts(state); },
      eligible(pool) { return excludeMastered(pool || index.list, state.entries).filter(positiveWeight); },
      eligibleCount() {
        let n = 0;
        for (const word of index.list) {
          const entry = state.entries[word.id];
          if (entry && entry.state === 'mastered') continue;
          if (!positiveWeight(word)) continue;
          n += 1;
        }
        return n;
      },
      applyRevealed(packId, cards) {
        sync();
        const result = applyRevealed(state, packId, cards, stampTime());
        if (result.changed) { api.persist(); api.emit('revealed'); }
        return result;
      },
      promote(id) {
        sync();
        const result = promote(state, id, stampTime());
        if (result.changed) { api.persist(); api.emit('promote'); }
        return result;
      },
      demote(id) {
        sync();
        const result = demote(state, id, stampTime());
        if (result.changed) { api.persist(); api.emit('demote'); }
        return result;
      },
      draw(count, rng) {
        /* 抽样前必须读到最新存档：另一页已掌握的词不能再进本页候选池。 */
        sync();
        const eligible = api.eligible();
        const picked = samplePack(eligible, count, typeof rng === 'function' ? rng : (opts.rng || cryptoRng()));
        return { eligible, picked };
      }
    };
    return api;
  }

  return {
    STORAGE_KEY, SCHEMA, PACK_SIZE, ORDER, RARITY_ZH,
    COOLDOWN_KEY, COOLDOWN_SCHEMA, COOLDOWN_LOCK, PACK_COOLDOWN_MS,
    cryptoRng, createStorage, storageFromGlobal, locksFromGlobal, emptyState, parseStored,
    createIndex, positiveWeight, buildCumulative, searchCumulative, excludeMastered,
    samplePack, sortByRarityStable, rankOf,
    normalizeSpelling, checkSpelling, maskTargetWord,
    sanitizeCooldownValue, positiveInterval, cooldownWait, claimCooldown,
    parseCooldownStored, formatCountdown, createCooldownStore,
    applyRevealed, promote, demote, counts,
    formatProbability, formatFrequency, createStore
  };
});
</script>
<script>/* Wordpack 壳层：双词库入口、词库抽屉、拼写校验对话框、单词详情、概率与数据说明。
 * 只依赖 src/learning.js 的纯逻辑与原生 DOM；无框架、无构建依赖。
 */
(() => {
  'use strict';
  const L = window.WordpackLogic;
  const data = window.Wordpack || {};
  const POOL = Array.isArray(data.pool) ? data.pool : [];
  const meta = data.meta || {};
  const index = L.createIndex(POOL);
  const store = L.createStore({ index });
  /* 冷却期限独立成键：两库 schema 与全部学习进度保持原样。 */
  const cooldown = L.createCooldownStore({ interval: meta.packCooldownMs || L.PACK_COOLDOWN_MS });
  const RARITY_ZH = { common: '常见', rare: '稀有', epic: '史诗', legendary: '传说', ...(meta.rarityNames || {}) };

  const el = id => document.getElementById(id);
  const topbar = el('wp-topbar');
  const main = el('wp-main');
  const footer = el('wp-footer');
  const learningButton = el('lib-learning');
  const masteredButton = el('lib-mastered');
  const drawer = el('library-drawer');
  const spellDialog = el('spell-dialog');
  const detailDialog = el('detail-dialog');
  const dataDialog = el('data-dialog');
  const scrim = el('wp-scrim');
  const banner = el('storage-banner');
  const toast = el('wp-toast');
  let stageApi = null, activeDialog = null, toastTimer = 0;
  let drawerTab = 'learning', drawerQuery = '', drawerLimit = 240;

  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  };
  const show = node => { node.hidden = false; };
  const hide = node => { node.hidden = true; };

  function showToast(text) {
    toast.textContent = text;
    show(toast);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => hide(toast), 2600);
  }

  /* ---------- 顶栏计数 / 存储可用性 ---------- */
  function refreshCounts() {
    const c = store.counts();
    const eligible = store.eligibleCount ? store.eligibleCount() : store.eligible().length;
    learningButton.querySelector('.wp-count').textContent = c.learning;
    masteredButton.querySelector('.wp-count').textContent = c.mastered;
    learningButton.setAttribute('aria-label', `正在学，${c.learning} 个词`);
    masteredButton.setAttribute('aria-label', `已学过，${c.mastered} 个词`);
    el('eligible-count').textContent = eligible;
    el('pool-count').textContent = meta.wordCount || index.size;
    if (drawer && inStack(drawer)) renderDrawer();
    if (stageApi) stageApi.refresh();
  }

  let warnedSessionOnly = false;
  function renderBanner() {
    if (!store.sessionOnly) { hide(banner); return; }
    banner.textContent = '浏览器本地存储不可用或写入失败：进度只保存在本次会话，刷新后会清空。';
    show(banner);
    if (!warnedSessionOnly) { warnedSessionOnly = true; showToast('本地存储不可用或写入失败，进度仅保存在本次会话。'); }
  }

  /* ---------- 对话框通用：弹窗栈（栈顶即唯一活动弹窗）+ 焦点管理 ---------- */
  const stageBusy = () => Boolean(stageApi && stageApi.isBusy && stageApi.isBusy());
  const BUSY_HINT = '开包进行中（含限频等待），稍后再改动词库。';
  const DIALOGS = [drawer, spellDialog, detailDialog, dataDialog];
  let stack = [];
  const topEntry = () => (stack.length ? stack[stack.length - 1] : null);
  const inStack = node => stack.some(entry => entry.node === node);
  const resolveFocus = target => (typeof target === 'function' ? target() : target);
  const firstFocusable = node => node.querySelector('input, button:not([disabled]), [tabindex]:not([tabindex="-1"])');
  /* 卡片触发点会被舞台临时 disabled，焦点当场掉到 body，body 不能算可恢复的触发入口。 */
  const isReachable = node => Boolean(node) && node !== document.body && document.contains(node) && !node.disabled && !node.closest('[hidden]') && !node.closest('[inert]');
  function focusNode(node) { const target = resolveFocus(node); if (isReachable(target)) target.focus({ preventScroll: true }); }
  function lockPage(on) {
    [topbar, main, footer].forEach(region => {
      if (!region) return;
      region.inert = on;
      if (on) region.setAttribute('aria-hidden', 'true'); else region.removeAttribute('aria-hidden');
    });
    document.body.classList.toggle('wp-dialog-open', on);
  }
  /** 所有 modal/drawer 同为 z-index:70 且 shell 里 detail 排在 spell 之后，所以必须靠可见性而不是层序压窗：push/pop 后只让栈顶可见可交互。 */
  function paintStack() {
    const top = topEntry();
    DIALOGS.forEach(node => {
      if (node === (top && top.node)) { node.hidden = false; node.inert = false; node.removeAttribute('aria-hidden'); }
      else if (inStack(node)) { node.hidden = true; node.inert = true; node.setAttribute('aria-hidden', 'true'); }
      else { node.inert = false; node.removeAttribute('aria-hidden'); }
    });
  }
  function openDialog(node, focusTarget, fallback) {
    stack.push({ node, returnFocus: document.activeElement, fallback: fallback || null });
    activeDialog = node;
    show(scrim);
    lockPage(true);
    paintStack();
    focusNode(focusTarget || firstFocusable(node));
  }
  /** 关闭 node（缺省关栈顶）连同它之上的所有弹窗；焦点回到仍然可见的触发入口。 */
  function closeDialog(node, reason, focusAfter) {
    if (!stack.length) return;
    const at = node ? stack.findIndex(entry => entry.node === node) : -1;
    const closed = stack.splice(at < 0 ? stack.length - 1 : at);
    closed.forEach(entry => {
      hide(entry.node);
      if (entry.node === spellDialog) settleSpell({ ok: false, reason: reason || 'cancelled' });
    });
    const rest = topEntry();
    activeDialog = rest ? rest.node : null;
    if (!rest) { hide(scrim); lockPage(false); }
    paintStack();
    const trigger = resolveFocus(focusAfter);
    const back = isReachable(trigger) ? trigger : closed[0].returnFocus;
    if (rest) focusNode(isReachable(back) ? back : firstFocusable(rest.node));
    else focusNode(isReachable(back) ? back : closed[0].fallback);
  }
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && activeDialog) { event.preventDefault(); closeDialog(null, 'cancelled'); return; }
    if (event.key !== 'Tab' || !activeDialog) return;
    const focusables = activeDialog.querySelectorAll('button:not([disabled]), input, [href], [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  scrim.addEventListener('click', () => closeDialog(null, 'cancelled'));

  /* ---------- 拼写校验：唯一的掌握入口 ---------- */
  let spellResolve = null, spellWord = null;
  function settleSpell(result) {
    const resolve = spellResolve;
    spellResolve = null; spellWord = null;
    if (resolve) resolve(result);
  }
  /* 卡片上的“标记已学过”在拼写期间被舞台临时 disabled，取消后焦点回到同张卡面，回不去就退回顶栏库按钮。 */
  function cardFace(word) {
    const stage = document.getElementById('holo-pack-opening');
    const slot = stage ? Array.from(stage.querySelectorAll('.card-slot')).find(node => node.dataset.word === word.id) : null;
    return slot ? slot.querySelector('.card-button') : null;
  }
  const spellFallback = word => () => cardFace(word) || (store.stateOf(word.id) === 'mastered' ? masteredButton : learningButton);
  function requestPromote(word) {
    if (store.stateOf(word.id) === 'mastered') return Promise.resolve({ ok: false, reason: 'already-mastered' });
    if (stageBusy()) { showToast(BUSY_HINT); return Promise.resolve({ ok: false, reason: 'opening' }); }
    if (activeDialog === spellDialog) closeDialog(spellDialog, 'replaced');
    spellWord = word;
    const meaning = spellDialog.querySelector('.wp-spell-meaning');
    meaning.replaceChildren(...String(word.meaningZh || '（本词库暂无释义）').split('\n')
      .map(line => make('div', 'wp-meaning-line', L.maskTargetWord(line, word.word))));
    const posChip = spellDialog.querySelector('.wp-spell-pos');
    posChip.textContent = word.pos ? `词性 ${word.pos}` : '';
    posChip.hidden = !word.pos;
    spellDialog.querySelector('.wp-spell-length').textContent = `共 ${String(word.word || '').length} 个字母`;
    const input = spellDialog.querySelector('.wp-spell-input');
    input.value = '';
    input.setCustomValidity('');
    hide(spellDialog.querySelector('.wp-spell-error'));
    show(spellDialog.querySelector('.wp-spell-hint'));
    openDialog(spellDialog, input, spellFallback(word));
    return new Promise(resolve => { spellResolve = resolve; });
  }
  function submitSpell() {
    const input = spellDialog.querySelector('.wp-spell-input');
    const word = spellWord;
    if (!word) return;
    const check = L.checkSpelling(input.value, word.word);
    const error = spellDialog.querySelector('.wp-spell-error');
    if (!check.given.length) {
      error.textContent = '请先输入你记得的拼写。';
      show(error); input.focus();
      return;
    }
    if (!check.ok) {
      error.textContent = '拼写不正确，再试一次。为保持训练效果，这里不会显示答案。';
      show(error);
      input.classList.remove('is-shaking'); void input.offsetWidth; input.classList.add('is-shaking');
      input.select();
      return;
    }
    store.promote(word.id);
    settleSpell({ ok: true, id: word.id });
    // 焦点优先回到那张卡片的卡面按钮（拼写通过后“标记已学过”按钮会被禁用），拿不到再退回 openDialog 记录的 fallback。
    closeDialog(spellDialog, 'spelled', () => cardFace(word));
    showToast(`拼写正确，“${word.word}”已移入已学过。`);
  }
  spellDialog.querySelector('.wp-spell-form').addEventListener('submit', event => { event.preventDefault(); submitSpell(); });
  const bindClose = (node, reason) => node.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeDialog(node, reason)));
  bindClose(spellDialog, 'cancelled');
  bindClose(drawer, 'dismissed');
  bindClose(detailDialog, 'dismissed');
  bindClose(dataDialog, 'dismissed');

  /* ---------- 单词详情 ---------- */
  function openDetail(word) {
    const body = detailDialog.querySelector('.wp-detail-body');
    const c = store.counts();
    const entry = store.entryOf(word.id);
    const mastered = Boolean(entry && entry.state === 'mastered');
    const eligible = store.eligible();
    const eligibleWeight = eligible.reduce((sum, w) => sum + (L.positiveWeight(w) ? w.frequency : 0), 0);
    const inPool = !mastered && eligible.some(w => w.id === word.id);
    const firstPick = inPool && eligibleWeight > 0 ? word.frequency / eligibleWeight : 0;
    body.replaceChildren();
    const head = make('div', 'wp-detail-head');
    head.append(make('div', 'wp-detail-word', word.word));
    if (word.phonetic) head.append(make('div', 'wp-detail-phonetic', `/${word.phonetic}/`));
    head.append(make('div', 'wp-detail-rarity', `稀有度 ${RARITY_ZH[word.rarity] || word.rarity}（仅展示标签）`));
    body.append(head);
    const meanings = make('div', 'wp-detail-meanings');
    String(word.meaningZh || '（本词库暂无释义）').split('\n').forEach(line => meanings.append(make('div', 'wp-meaning-line', line)));
    body.append(make('h3', 'wp-detail-h', '释义'));
    body.append(meanings);
    const traits = [];
    if (word.pos) traits.push(`词性 ${word.pos}`);
    if (word.phonetic) traits.push(`音标 /${word.phonetic}/（来自 ECDICT，未逐词校对）`);
    if (traits.length) {
      body.append(make('h3', 'wp-detail-h', '词性与音标'));
      body.append(make('p', 'wp-detail-p', traits.join(' · ')));
    }
    body.append(make('h3', 'wp-detail-h', '频次与概率'));
    const facts = make('dl', 'wp-facts');
    const fact = (term, value) => { facts.append(make('dt', null, term)); facts.append(make('dd', null, value)); };
    fact('语料频次', `${L.formatFrequency(word.frequency)} 次（OpenSubtitles 2018 字幕词形出现次数）`);
    fact('全词库基线', `${L.formatProbability(word.probability)}（frequency ÷ ${L.formatFrequency(meta.totalWeight)}）`);
    fact('当前可抽', `${eligible.length} 词 · 分母总频次 ${L.formatFrequency(eligibleWeight)}`);
    fact('下一包首张抽到它', mastered ? '已学过，不参与抽取' : `${L.formatProbability(firstPick)}${entry ? '' : ' · 还没抽到过，随时可能首现'}`);
    fact('语料排名 / 词库排名', `#${L.formatFrequency(word.corpusRank)} / #${L.formatFrequency(word.poolRank)}`);
    fact('你抽到它的次数', entry ? `${entry.count} 次 · ${entry.state === 'mastered' ? '已学过' : '正在学'}` : '还没抽到过');
    body.append(facts);
    body.append(make('p', 'wp-detail-note', `每抽一张都要重算分母：先去掉已学过的词和本包里已经抽出的词，再按剩下词的频次加权，所以“下一包首张”比全词库基线更贴近实际。已学过的词不再进入抽取池（概率为 0），正在学的词可以跨包重复抽到，同一包内不会重复。没有保底、没有档位抽样，也不给新词加权。全词库 ${meta.wordCount || index.size} 词 / 总权重 ${L.formatFrequency(meta.totalWeight)}，正在学 ${c.learning}、已学过 ${c.mastered}。`));
    const footerRow = make('div', 'wp-detail-actions');
    const mark = make('button', 'wp-btn wp-btn-primary');
    mark.type = 'button';
    if (mastered) { mark.textContent = '已学过'; mark.disabled = true; }
    else if (!entry) { mark.textContent = '还没抽到过，先开一包'; mark.disabled = true; }
    else { mark.textContent = '标记已学过（需拼写正确）'; mark.addEventListener('click', async () => { const r = await requestPromote(word); if (r.ok) closeDialog(detailDialog, 'spelled'); }); }
    footerRow.append(mark);
    footerRow.append(Object.assign(make('button', 'wp-btn', '关闭'), { type: 'button', onclick: () => closeDialog(detailDialog, 'dismissed') }));
    body.append(footerRow);
    detailDialog.querySelector('.wp-detail-title').textContent = '单词详情';
    openDialog(detailDialog);
  }

  /* ---------- 词库抽屉 ---------- */
  function renderDrawer() {
    const list = drawer.querySelector('.wp-lib-list');
    const empty = drawer.querySelector('.wp-lib-empty');
    drawer.querySelectorAll('[data-tab]').forEach(button => {
      const on = button.dataset.tab === drawerTab;
      button.setAttribute('aria-selected', String(on));
      button.classList.toggle('is-on', on);
    });
    const query = drawerQuery.trim().toLowerCase();
    const words = index.list.filter(word => {
      const entry = store.entryOf(word.id);
      if (!entry || entry.state !== drawerTab) return false;
      if (!query) return true;
      return word.word.toLowerCase().includes(query) || String(word.meaningZh || '').toLowerCase().includes(query);
    }).sort((a, b) => {
      const ea = store.entryOf(a.id), eb = store.entryOf(b.id);
      const ta = drawerTab === 'mastered' ? eb.masteredAt : eb.addedAt, tb2 = drawerTab === 'mastered' ? ea.masteredAt : ea.addedAt;
      return (ta || 0) - (tb2 || 0) || (a.poolRank || 0) - (b.poolRank || 0);
    });
    const c = store.counts();
    drawer.querySelector('.wp-lib-summary').textContent = drawerTab === 'learning'
      ? `正在学 ${c.learning} 个词 · 抽到后默认进入这里`
      : `已学过 ${c.mastered} 个词 · 每次都需拼写正确才能进入`;
    list.replaceChildren();
    if (!words.length) {
      empty.textContent = query ? `没有匹配“${drawerQuery}”的词。` : (drawerTab === 'learning' ? '还没有正在学的词：撕开卡包抽到词后会自动进入这里。' : '还没有已学过的词：在“正在学”里正确拼写一个词才会进入这里。');
      show(empty);
      return;
    }
    hide(empty);
    words.slice(0, drawerLimit).forEach(word => {
      const entry = store.entryOf(word.id);
      const row = make('li', 'wp-lib-row');
      const head = make('div', 'wp-lib-head');
      head.append(make('span', 'wp-lib-word', word.word));
      head.append(make('span', 'wp-lib-badge', `×${entry.count}`));
      head.append(make('span', 'wp-lib-rarity', RARITY_ZH[word.rarity] || word.rarity));
      row.append(head);
      row.append(make('div', 'wp-lib-meaning', String(word.meaningZh || '').split('\n')[0]));
      const actions = make('div', 'wp-lib-actions');
      const detail = make('button', 'wp-btn', '查看释义'); detail.type = 'button';
      detail.addEventListener('click', () => openDetail(word));
      actions.append(detail);
      if (entry.state === 'learning') {
        const promote = make('button', 'wp-btn wp-btn-primary', '标记已学过'); promote.type = 'button';
        promote.addEventListener('click', () => requestPromote(word).then(r => { if (r.ok) showToast(`拼写正确，“${word.word}”已移入已学过。`); }));
        actions.append(promote);
      } else {
        const again = make('button', 'wp-btn', '重新学习'); again.type = 'button';
        again.addEventListener('click', () => {
          store.demote(word.id);
          showToast(`“${word.word}”已回到正在学，下次移入已学过仍需重新拼写。`);
          refreshCounts();
        });
        actions.append(again);
      }
      row.append(actions);
      list.append(row);
    });
    if (words.length > drawerLimit) {
      const more = make('li', 'wp-lib-more');
      const button = make('button', 'wp-btn', `继续显示更多（还有 ${words.length - drawerLimit} 个）`); button.type = 'button';
      button.addEventListener('click', () => { drawerLimit += 240; renderDrawer(); });
      more.append(button); list.append(more);
    }
  }
  function openDrawer(tab) {
    if (stageBusy()) { showToast(BUSY_HINT); return; }
    store.sync();
    drawerTab = tab; drawerQuery = ''; drawerLimit = 240;
    drawer.querySelector('.wp-lib-search').value = '';
    renderDrawer();
    openDialog(drawer, drawer.querySelector('.wp-lib-search'), tab === 'learning' ? learningButton : masteredButton);
  }
  drawer.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => { drawerTab = button.dataset.tab; drawerLimit = 240; renderDrawer(); }));
  drawer.querySelector('.wp-lib-search').addEventListener('input', event => { drawerQuery = event.target.value; drawerLimit = 240; renderDrawer(); });
  learningButton.addEventListener('click', () => openDrawer('learning'));
  masteredButton.addEventListener('click', () => openDrawer('mastered'));

  /* ---------- 概率与数据说明 ---------- */
  function renderDataDialog() {
    const body = dataDialog.querySelector('.wp-data-body');
    body.replaceChildren();
    const section = (title, lines) => {
      body.append(make('h3', 'wp-detail-h', title));
      lines.forEach(line => body.append(make('p', 'wp-detail-p', line)));
    };
    const c = store.counts();
    const eligible = store.eligible();
    const eligibleWeight = eligible.reduce((sum, w) => sum + (L.positiveWeight(w) ? w.frequency : 0), 0);
    section('抽取规则', [
      `固定词库共 ${meta.wordCount || index.size} 个词，每个词的权重就是它的真实使用频次；${L.formatFrequency(meta.totalWeight)} 是全词库的频次总和。`,
      '每次抽取的分母是“当前还能抽到的词”的频次总和：已经学过的词、以及本包里已经抽出的词都会先被排除出去，然后用剩下词的频次重新求和再加权抽取。',
      '所以某个词下一次被抽到的概率，取决于当时剩下多少词、它们的频次有多大，而不是一个固定值；排除后剩下的词越少，每个词的概率就越高。',
      `每包最多 5 张，无放回地逐张抽取，同一包内不会出现重复词；正在学的词可以跨包被重复抽到。剩余可抽的词不足 5 个时按实际数量发牌，一个都不剩时禁用开包（当前可抽 ${eligible.length} 词，分母总频次 ${L.formatFrequency(eligibleWeight)}）。`,
      '没有保底机制，也不先抽稀有度档位、不给新词加权。稀有度（常见/稀有/史诗/传说）只是展示标签，来自固定词库的频次分位阈值，不参与抽样，结果只按稀有度排序以便演出。'
    ]);
    section('当前状态', [
      `可抽 ${eligible.length} 词 · 正在学 ${c.learning} · 已学过 ${c.mastered} · 已抽过 ${c.seen}。`,
      `进度保存在你自己的浏览器里，只包含你抽到过的词，不会预先填入整个词库。${store.sessionOnly ? '当前本地存储不可用或写入失败，进度仅保存在本次会话，刷新后会清空。' : '刷新后仍然保留。'}`
    ]);
    section('数据版本与来源', [
      `${meta.datasetName || '固定词库'}（版本 ${meta.version || '未知'}，取数日期 ${meta.retrievedAt || '未知'}）。`,
      `释义与音标来自 ECDICT（commit ${meta.dictionaryCommit || '未知'}，MIT 许可）；频次来自 FrequencyWords 的 OpenSubtitles 2018 英文字幕词表（commit ${meta.frequencyCommit || '未知'}，内容 CC BY-SA 4.0）。`,
      '派生数据集按 CC BY-SA 4.0 再分发；卡包动效模板为 MIT 许可（card-pack-opening, © 2026 chrisocling），许可证副本随源码提供。',
      ...(meta.attribution ? [meta.attribution] : [])
    ]);
    section('局限（如实说明）', meta.limits && meta.limits.length ? meta.limits : ['字幕语料偏向影视对白，频次不代表所有英文场景的使用量。']);
    if (meta.tagScopeNote) body.append(make('p', 'wp-detail-p', meta.tagScopeNote));
  }
  el('data-button').addEventListener('click', () => { renderDataDialog(); openDialog(dataDialog); });

  /* ---------- 音效开关（默认关闭） ---------- */
  const soundButton = el('sound-button');
  function paintSound() {
    const on = Boolean(stageApi && stageApi.soundOn);
    soundButton.setAttribute('aria-pressed', String(on));
    soundButton.querySelector('.wp-sound-state').textContent = on ? '开' : '关';
  }
  soundButton.addEventListener('click', () => {
    if (!stageApi) { showToast('舞台脚本尚未就绪。'); return; }
    stageApi.setSound(!stageApi.soundOn);
    paintSound();
  });

  /* ---------- 桥接给舞台的逻辑 ---------- */
  window.WordpackUI = {
    cooldown,
    sample(count) { return store.draw(count).picked; },
    /** 舞台真正开包前调用：先读最新存档，再按最新库抽样/入库。 */
    sync() { return store.sync(); },
    canOpen() { return store.eligible().length > 0; },
    eligibleCount() { return store.eligible().length; },
    counts() { return store.counts(); },
    stateOf(id) { return store.stateOf(id); },
    /** 开包限频的锁内校验：只有最新存档里确实还有可抽词，才允许占用一次冷却。 */
    hasEligible() { store.sync(); return store.eligible().length > 0; },
    entryOf(id) { return store.entryOf(id); },
    onRevealed(packId, words) { store.applyRevealed(packId, words); refreshCounts(); },
    requestPromote(word) { return requestPromote(word); },
    openDetail(word) { openDetail(word); },
    attachStage(api) { stageApi = api; paintSound(); refreshCounts(); }
  };
  store.subscribe(() => { renderBanner(); refreshCounts(); });

  /* ---------- 同源其他标签页写入：读最新存档刷新视图，不重载页面、不清进度 ---------- */
  window.addEventListener('storage', event => {
    if (event.key && event.key !== L.STORAGE_KEY) return;
    const result = store.sync();
    if (!result) return;
    renderBanner();
    refreshCounts();
    if (result.changed) showToast('已同步另一个标签页的学习进度。');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const result = store.sync();
    if (!result || !result.changed) return;
    renderBanner();
    refreshCounts();
  });

  renderBanner();
  refreshCounts();
  paintSound();
})();
</script>
<script>/* Wordpack 舞台：源自 reference/card-pack-opening/assets/pack-opening.html（MIT, © 2026 chrisocling）。
 * 本项目副本的改动：白色舞台、词卡卡面与操作行、逐词频次加权抽样（排除已学过、包内无放回、最多 5 张）、
 * 0 词可抽时禁用撕包、整包演出完成后按 packId 幂等入库。撕包/彩虹/绕圈/表情时序沿用原模板。
 */
(() => {
  'use strict';
  const root = document.getElementById('holo-pack-opening');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = 'true';

  const L = window.WordpackLogic;
  const data = window.Wordpack || {};
  const meta = data.meta || {};
  const POOL = Array.isArray(data.pool) ? data.pool : [];
  const PACK_SIZE = Math.max(1, Math.min(10, Number(meta.packSize) || 5));
  const NO_BRIDGE = '此预览未加载学习库脚本，抽卡只做展示，不会记录进度。';

  const $ = selector => root.querySelector(selector);
  const NS = 'http://www.w3.org/2000/svg';
  const stage = $('.holo-stage'), zone = $('.pack-zone'), floating = $('.pack-float'), shaker = $('.pack-shake'), tilt = $('.pack-tilt'), pack = $('.pack-body');
  const art = $('.pack-art'), tearSvg = $('.tear-line'), hint = $('.rip-hint'), rainbow = $('.rainbow'), flash = $('.stage-flash');
  const tray = $('.cards-tray'), action = $('.open-action'), status = $('.status-line'), summary = $('.result-summary');
  const canvas = $('.confetti'), context = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const speed = Number.isFinite(meta.speed) ? Math.max(.5, Math.min(2, meta.speed)) : 1;
  const ms = value => reduced.matches ? Math.min(80, value / speed) : value / speed;
  const rand = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; } catch { return Math.random(); } };
  const ui = () => window.WordpackUI || null;

  /* ---------- 冷却门禁：UI 入口与 burstOpen 双重检查，绝不只靠禁用按钮 ---------- */
  const localCooldown = L.createCooldownStore({ interval: L.positiveInterval(meta.packCooldownMs) });
  const gate = () => { const bridge = ui(); return (bridge && bridge.cooldown) || localCooldown; };
  const cooldownWait = () => { try { return Math.max(0, gate().waitMs()); } catch { return 0; } };
  const cooling = () => cooldownWait() > 0;
  /** 倒计时周期：以桥接 store 为准，缺失时回落到数据清单的 packCooldownMs，绝不写死 60 秒。 */
  function cooldownPeriod() {
    const fromGate = gate().interval;
    return L.positiveInterval(fromGate || meta.packCooldownMs);
  }

  /* ---------- 文案 ---------- */
  const ORDER = ['common', 'rare', 'epic', 'legendary'];
  const rank = rarity => { const i = ORDER.indexOf(rarity); return i < 0 ? 0 : i; };
  const rarityNames = { common: '常见', rare: '稀有', epic: '史诗', legendary: '传说', ...(meta.rarityNames || {}) };
  const labels = {
    hint: '按住卡包向右拖动，撕开它',
    packAria: '英语词卡卡包。按住向右滑动撕开，也可以按右方向键',
    nudge: '点一下撕不开哦，按住向右滑动试试',
    keyNudge: '按右方向键 → 就能撕开',
    sealed: '{count} 张英语词卡，等你拆开',
    sealedPool: '{count} 张待拆 · 正在学 {learning} · 已学过 {mastered}',
    tearing: '继续向右，快撕开了',
    opening: '撕开一点，快乐多一点',
    revealed: '{count} 张词卡已就位',
    best: '本包最稀有：{rarity} · {name}！',
    selected: '{name} · {rarity}',
    again: '再开一包',
    cooldownRip: '这一包刚撕开过，等倒计时结束就能再撕',
    cooldownDone: '倒计时结束，可以撕下一包了',
    cooldownNote: '本地存储不可用，冷却只计时本次页面',

    drag.moved = Math.max(drag.moved, Math.hypot(event.clientX - drag.x, event.clientY - drag.y));
    const dx = (event.clientX - drag.x) / drag.scale;
    if (dx > 0) advanceTear(Math.min(W, drag.from + dx / drag.span * (W - drag.from)));
  });
  zone.addEventListener('pointerup', endDrag);
  zone.addEventListener('pointercancel', event => { endDrag(event); suppressClick = true; });
  zone.addEventListener('pointerleave', () => { if (!drag) resetTilt(); });
  zone.addEventListener('click', event => {
    if (suppressClick && event.detail !== 0) { suppressClick = false; return; }
    suppressClick = false; nudge(event.detail === 0);
  });
  pack.addEventListener('keydown', event => {
    if (state !== 'sealed' || root.dataset.entering || event.key !== 'ArrowRight') return;
    if (blockedByClaim()) return;
    if (!canOpen()) { say(sealedText()); return; }
    if (blockedByCooldown()) { blinkPack(); return; }
    event.preventDefault(); audio.unlock();
    if (root.dataset.packFace !== 'strain') audio.strain();
    setPackFace('strain'); clearTimeout(strainTimer); strainTimer = setTimeout(() => { if (state === 'sealed' && !drag) setPackFace(null); }, 450);
    advanceTear(Math.min(W, front + W * .25));
  });

  /* ---------- 开包演出 ---------- */
  function sprayRainbow(origin) {
    if (reduced.matches) return;
    rainbow.style.left = `${origin.x}px`; rainbow.style.top = `${origin.y}px`;
    animate(rainbow, [
      { opacity: 0, transform: 'translate(-50%,-97%) scale(.45,.3)' }, { opacity: 1, transform: 'translate(-50%,-97%) scale(1,1)', offset: .22 },
      { opacity: 1, transform: 'translate(-50%,-97%) scale(1.06,1.1)', offset: .72 }, { opacity: 0, transform: 'translate(-50%,-98%) scale(1.1,1.16)' }
    ], { duration: 1300, easing: 'cubic-bezier(.2,.7,.25,1)' });
    ribbons.forEach((path, i) => {
      const length = path.getTotalLength(); path.style.strokeDasharray = `${length} ${length}`;
      animate(path, [{ strokeDashoffset: `${length}px` }, { strokeDashoffset: '0px', offset: .5 }, { strokeDashoffset: `${-length * .85}px` }], { duration: 1200, delay: (i % 4) * 30, easing: 'cubic-bezier(.25,.7,.3,1)' });
    });
  }
  function burst(origin, best) {
    const list = [];
    for (let i = 0; i < 44; i++) list.push(confettiBit(origin.x + (rand() - .5) * W * .8, origin.y, VIVID[i % VIVID.length]));
    for (let i = 0; i < 30; i++) list.push((i % 2 ? streak : spark)(origin.x + (rand() - .5) * W * .9, origin.y, VIVID[i % VIVID.length]));
    if (best === 'legendary') for (let i = 0; i < 44; i++) list.push(star(origin.x, origin.y, GOLD[i % GOLD.length]));
    else if (best === 'epic') for (let i = 0; i < 22; i++) list.push(star(origin.x, origin.y, EPIC[i % EPIC.length]));
    spawn(list);
  }
  function celebrate(c) {
    const width = stage.clientWidth, list = [];
    for (let i = 0; i < 80; i++) list.push(petal(rand() * width, -12 - rand() * 80, PETALS[i % PETALS.length]));
    for (let i = 0; i < 56; i++) list.push(confettiBit(c.x + (rand() - .5) * 40, c.y, VIVID[i % VIVID.length]));
    for (let i = 0; i < 22; i++) list.push(star(c.x, c.y, i % 2 ? '#ffffff' : '#ffe066'));
    spawn(list);
  }
  function flashAt(origin) {
    if (reduced.matches) return;
    flash.style.setProperty('--flash-x', `${origin.x}px`); flash.style.setProperty('--flash-y', `${origin.y}px`);
    animate(flash, [{ opacity: 0 }, { opacity: .9, offset: .25 }, { opacity: 0 }], { duration: 800, easing: 'ease-out' });
  }
  function land(slot, word) {
    slot.classList.add('landed'); audio.land(word.rarity);
    if (rank(word.rarity) < 2) return;
    const box = slot.getBoundingClientRect(), stageBox = stage.getBoundingClientRect();
    const cx = box.left - stageBox.left + box.width / 2, cy = box.top - stageBox.top + box.height / 2, colors = word.rarity === 'legendary' ? GOLD : EPIC;
    spawn(Array.from({ length: word.rarity === 'legendary' ? 36 : 18 }, (_, i) => star(cx + (rand() - .5) * box.width * .6, cy + (rand() - .5) * box.height * .6, colors[i % colors.length])));
    if (word.rarity === 'legendary') flashAt({ x: cx, y: cy });
  }
  function newPackId() {
    let r = '';
    try { r = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(36)).join(''); } catch { r = Math.random().toString(36).slice(2); }
    return `p${Date.now().toString(36)}${r}`;
  }
  /** 整包演出完成且当前 run 仍有效时才入库一次（放在 Promise.all(flights) 之后）。 */
  function commitPack() {
    const bridge = ui();
    if (!bridge || !drawnPackId || !drawn || !drawn.length) return;
    bridge.onRevealed(drawnPackId, drawn);
  }
  async function burstOpen() {
    if (state !== 'sealed' || claimPending) return;
    const current = ++run, hadFocus = document.activeElement === pack;
    /* 真正开包必须先读到最新学习状态，再按该状态抽样；空池不占用冷却次数。 */
    const bridge = ui();
    if (bridge && bridge.sync) { try { bridge.sync(); } catch {} }
    drawn = drawPack();
    drawnPackId = drawn.length ? newPackId() : '';
    if (!drawn.length) { front = 0; applyTear(); say(sealedText()); return; }
    /* 只有“完整撕开且结果非空”才占用一次：claim 内部会重新读取共享存储（含其他标签页写入的期限），
       verify 在锁内再确认预选仍然有效（未被库操作清空）且最新库里确实还有可抽词；被拒或校验失败都不写期限。 */
    claimPending = true;
    const stillValid = () => state === 'sealed' && Boolean(drawn) && drawn.length > 0;
    const eligibleNow = () => { const b = ui(); return b && b.hasEligible ? b.hasEligible() : true; };
    let claim;
    try { claim = await gate().claim(() => stillValid() && eligibleNow()); }
    finally { claimPending = false; }
    if (current !== run || state !== 'sealed') return;
    if (!claim || !claim.ok) {
      const failed = claim && (claim.reason === 'lock-failed' || claim.reason === 'storage-failed');
      front = 0; applyTear(); drawn = null; drawnPackId = '';
      root.style.setProperty('--glow', '#ffffff');
      say(L_(failed ? 'cooldownLockFailed' : 'cooldownRip'));
      armCooldown();
      return;
    }
    if (!drawn || !drawn.length) {
      /* 理论上锁内 verify 已挡住，这里只是兜底：绝不带着空预选进入演出。 */
      front = 0; applyTear(); drawn = null; drawnPackId = '';
      root.style.setProperty('--glow', '#ffffff');
      say(L_('sealedEmptyPool'));
      armCooldown();
      return;
    }
    cooldownAnnounced = true;
    armCooldown();
    const best = bestOf(drawn).rarity;
    front = W; applyTear();
    endDrag(); changeState('opening'); clearTimeout(nudgeTimer);
    pack.disabled = true; action.hidden = true;
    say(L_('opening'));
    renderCards(drawn);
    /* 舞台高度会随状态与结果行数变化，必须在布局确定后再取喷口原点，否则动画起点跳错。 */
    const origin = packPoint(W / 2, TY);
    audio.rip(); audio.burst(best); setPackFace('happy');
    if (reduced.matches) {
      slots.forEach(slot => { slot.style.opacity = '1'; });
      if (current === run) { commitPack(); showRevealed(); if (hadFocus && cardButtons[0]) cardButtons[0].focus({ preventScroll: true }); }
      return;
    }
    const flapFrom = flap.style.transform || 'none';
    animate(flap, [{ transform: flapFrom, opacity: 1 }, { transform: `${flapFrom} translate(-30px,-120px) rotate(38deg)`, opacity: 0 }], { duration: 560, easing: 'cubic-bezier(.2,.6,.3,1)' });
    sprayRainbow(origin); burst(origin, best);
    if (best === 'legendary') flashAt(origin);
    const stageBox = stage.getBoundingClientRect(), zoneBox = zone.getBoundingClientRect();
    const center = { x: zoneBox.left - stageBox.left + zoneBox.width / 2, y: zoneBox.top - stageBox.top + zoneBox.height * .48 };
    const count = slots.length, firstBox = slots[0].querySelector('.card-button').getBoundingClientRect();
    const radius = Math.max(60, Math.min(stage.clientWidth * .28, stage.clientHeight * .27, 170)) * (count < 3 ? .55 : 1);
    const ringScale = Math.max(.42, Math.min(.68, (stage.clientHeight * .86 - 2 * radius) / firstBox.height));
    const START = 200, OUT = 380, SPIN = 1250, LAND = 620, HOLD = 220, STEPS = 18;
    const ease = t => .5 - Math.cos(Math.PI * t) / 2;
    const flights = slots.map((slot, index) => {
      const box = slot.querySelector('.card-button').getBoundingClientRect(), word = drawn[index];
      const sx = box.left - stageBox.left + box.width / 2, sy = box.top - stageBox.top + box.height / 2;
      const at = (x, y, extra) => `translate(${(x - sx).toFixed(1)}px,${(y - sy).toFixed(1)}px) ${extra}`;
      const theta = -Math.PI / 2 + index * Math.PI * 2 / count, fan = (index - (count - 1) / 2) * 9;
      const frames = [
        { t: 0, transform: at(origin.x, origin.y + box.height * .5, `rotate(${fan * .3}deg) scale(.5)`), opacity: 0, easing: 'cubic-bezier(.2,.7,.3,1)' },
        { t: OUT * .45, transform: at(origin.x + fan * 1.6, origin.y - box.height * .3, `rotate(${fan}deg) scale(.6)`), opacity: 1, easing: 'cubic-bezier(.3,.6,.4,1)' }
      ];
      for (let k = 0; k <= STEPS; k++) {
        const phi = Math.PI * 2 * ease(k / STEPS), x = center.x + Math.cos(theta + phi) * radius, y = center.y + Math.sin(theta + phi) * radius;
        frames.push({ t: OUT + SPIN * k / STEPS, transform: at(x, y, `rotate(${(Math.cos(theta + phi) * 8).toFixed(1)}deg) scale(${(ringScale * (1 + .07 * Math.sin(Math.PI * k / STEPS))).toFixed(3)})`), opacity: 1, easing: 'linear' });
      }
      let end = OUT + SPIN;
      if (word.rarity === 'legendary') { end += HOLD; frames.push({ ...frames[frames.length - 1], t: end }); }
      frames[frames.length - 1].easing = 'cubic-bezier(.25,.75,.3,1)';
      frames.push({ t: end + LAND * .72, transform: 'translate(0px,-14px) rotate(0deg) scale(1.05)', opacity: 1, easing: 'ease-in-out' });
      frames.push({ t: end + LAND, transform: 'translate(0px,0px) rotate(0deg) scale(1)', opacity: 1 });
      const total = frames[frames.length - 1].t;
      return animate(slot, frames.map(({ t, ...frame }) => ({ ...frame, offset: t / total })), { duration: total, delay: START, easing: 'linear' }).then(() => { if (current === run) land(slot, word); });
    });
    setTimeout(() => { if (current === run) root.dataset.ring = 'true'; }, ms(START + OUT * .6));
    setTimeout(() => { if (current === run) audio.swirl(ms(SPIN) / 1000); }, ms(START + OUT));
    setTimeout(() => { if (current === run) { celebrate(center); audio.celebrate(); } }, ms(START + OUT + SPIN));
    animate(floating, [{ transform: 'translateY(0) rotate(-1deg)', opacity: 1 }, { transform: 'translateY(18px) rotate(2deg)', opacity: 1, offset: .28 }, { transform: 'translateY(450px) rotate(22deg)', opacity: 0 }], { duration: 780, delay: 360, easing: 'cubic-bezier(.55,.05,.8,.6)' });
    await Promise.all(flights);
    if (current !== run) return;
    commitPack();
    showRevealed();
    if (hadFocus && cardButtons[0]) cardButtons[0].focus({ preventScroll: true });
  }
  function showRevealed() {
    changeState('revealed'); tray.setAttribute('aria-hidden', 'false'); cardButtons.forEach(button => { button.disabled = false; });
    slots.forEach(slot => { const detail = slot.querySelector('.card-action.is-detail'); if (detail) detail.disabled = false; });
    repaintMarks();
    pack.disabled = true; action.hidden = false; action.textContent = L_('again');
    armCooldown();
    say(revealedText());
    summary.textContent = L_('summary', { names: drawn.map(word => `${word.word}（${rarityNames[word.rarity] || word.rarity}）`).join('、') });
  }
  function reset() {
    const hadFocus = document.activeElement === action;
    ++run; clearAnimations(); selected = -1; drawn = null; drawnPackId = ''; front = 0; makeTear(); applyTear(); delete root.dataset.ring;
    root.style.setProperty('--glow', '#ffffff'); changeState('sealed');
    tray.setAttribute('aria-hidden', 'true'); tray.replaceChildren(); slots = []; cardButtons = []; markButtons = [];
    pack.disabled = false; action.hidden = true;
    say(sealedText()); summary.textContent = ''; setLayout(Math.min(PACK_SIZE, POOL.length || PACK_SIZE));
    setPackFace(null); if (packEyes) packEyes.style.transform = '';
    enterPack();
    armCooldown();
    if (hadFocus) pack.focus({ preventScroll: true });
  }
  action.addEventListener('click', () => { if (state !== 'revealed' || tearingBusy() || blockedByCooldown()) return; reset(); });

  /* ---------- 对外接口（供壳层调用） ---------- */
  let soundOn = false;
  function setSound(on) {
    soundOn = Boolean(on);
    audio.setMuted(!soundOn);
    store.set('wordpack.sound.v1', soundOn);
    if (soundOn) { audio.unlock(); audio.land('rare'); }
    return soundOn;
  }
  window.WordpackStage = {
    get soundOn() { return soundOn; },
    setSound,
    isBusy: tearingBusy,
    refresh() {
      /* 等待锁或演出中：不改状态、不清预选，否则 await 回来后 bestOf(drawn) 会崩。 */
      if (tearingBusy()) return;
      /* sealed 期间的学习状态变化会让半撕预选失效（撕口进度保留），真正抽样仍在完整撕开时按最新库进行。 */
      if (state === 'sealed' && drawn) { drawn = null; drawnPackId = ''; root.style.setProperty('--glow', '#ffffff'); }
      repaintMarks();
      if (state === 'sealed') say(sealedText());
      armCooldown();
    },
    meaningLines
  };

  soundOn = Boolean(store.get('wordpack.sound.v1', false));
  audio.setMuted(!soundOn);
  setLayout(Math.min(PACK_SIZE, POOL.length || PACK_SIZE));
  say(sealedText());
  armCooldown();
  measure(); enterPack(); scheduleBlinks();
  const bridge = ui();
  if (bridge) bridge.attachStage(window.WordpackStage);
})();
</script>
</body>
</html>
